<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TaskFlow</title>
    <!-- Apply the saved light/dark choice (or the OS preference) before first paint to avoid a flash. -->
    <script>
      (function () {
        var saved;
        try {
          saved = localStorage.getItem('taskflow_theme');
        } catch (e) {}
        var prefersDark = window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches;
        document.documentElement.dataset.theme = saved === 'dark' || saved === 'light' ? saved : prefersDark ? 'dark' : 'light';
      })();
    </script>
    <!-- Inter stands in for SF Pro off Apple devices (see .claude/DESIGN.md) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap&subset=vietnamese"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
